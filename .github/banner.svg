<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="TravelDiary: a globe with dotted flight routes between pins">
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.rt{animation:d 3s linear infinite}@keyframes d{to{stroke-dashoffset:-28}}</style>
<defs><clipPath id="c"><rect width="1200" height="420" rx="24"/></clipPath></defs>
<g clip-path="url(#c)">

<rect width="1200" height="420" fill="#0E3B43"/>
<g transform="translate(900 210)">
<circle r="160" fill="#13606B"/>
<g fill="none" stroke="#5FB3B3" stroke-opacity="0.5"><ellipse rx="160" ry="56"/><ellipse rx="160" ry="112"/><ellipse rx="56" ry="160"/><ellipse rx="112" ry="160"/><line x1="-160" x2="160"/><line y1="-160" y2="160"/></g>
<path d="M-90 -40 Q -20 -120 60 -60" fill="none" stroke="#FFC857" stroke-width="3" stroke-dasharray="8 6" class="rt"/>
<path d="M60 -60 Q 110 10 40 70" fill="none" stroke="#FFC857" stroke-width="3" stroke-dasharray="8 6" class="rt"/>
<circle cx="-90" cy="-40" r="9" fill="#FFC857"/><circle cx="60" cy="-60" r="9" fill="#FFC857"/><circle cx="40" cy="70" r="9" fill="none" stroke="#FFC857" stroke-width="3"/>
</g>
<text x="56" y="110" font-family="Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#FFC857">LOGBOOK · THREE.JS</text>
<text x="56" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#F2EFE6">Travel Diary</text>
<text x="58" y="250" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#B7D6D6">An interactive 3D globe of every place I've been,</text>
<text x="58" y="282" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#B7D6D6">and the ones I still dream of.</text>
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EFE6"><circle cx="66" cy="340" r="7" fill="#FFC857"/><text x="82" y="345">visited</text><circle cx="172" cy="340" r="7" fill="none" stroke="#FFC857" stroke-width="2.5"/><text x="188" y="345">wishlist</text></g>

</g>
</svg>
